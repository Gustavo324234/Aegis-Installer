name: SRE Firewall - Pull Request Guard (Installer)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format-python:
    name: Backend Formatting (Black - SRE Auto-Repair)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ (github.actor == 'Gustavo324234' || github.actor == 'Gus-Agost') && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Black
        run: pip install "black>=24,<25"

      - name: Run Black Check
        run: black --check .
        continue-on-error: ${{ github.actor == 'Gustavo324234' || github.actor == 'Gus-Agost' }}

      - name: Auto-Repair Formatting (Only for Gustavo)
        if: github.actor == 'Gustavo324234' || github.actor == 'Gus-Agost'
        run: black .

      - name: Auto-Commit Formatting (Only for Gustavo)
        if: github.actor == 'Gustavo324234' || github.actor == 'Gus-Agost'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Python code (SRE Auto-Repair)"
          commit_options: "--no-verify"

  lint-shell:
    name: Linting (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck *.sh

  test:
    name: Hardening Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pytest
      - name: Run Pytest
        run: pytest .

  security-audit:
    name: Security Vulnerability Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Security Audit
        run: bandit -r . -ll

  automerge:
    name: Auto-Merge (Solo Gustavo)
    needs: [format-python, lint-shell, test, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.actor == 'Gustavo324234' || github.actor == 'Gus-Agost')
    steps:
      - name: Auto-Merge Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$GITHUB_URL"
